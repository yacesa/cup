<!-- =========================================
CEO LEAGUE - PREMIUM SPIN SYSTEM
FULL ANIMATION DRAW VERSION
========================================= -->

<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=390,
initial-scale=1,
maximum-scale=1,
user-scalable=no
">

<title>CEO LEAGUE SPIN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{

width:100%;
max-width:390px;
min-width:390px;

margin:auto;

overflow-x:hidden;

padding:12px;

color:white;

background:
linear-gradient(
rgba(0,0,0,.78),
rgba(0,0,0,.88)
),
url('download (20).jpg');

background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;

}

/* OVERLAY */

body::before{

content:'';

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
radial-gradient(
circle at top,
rgba(0,110,255,.18),
transparent 40%
),
radial-gradient(
circle at bottom,
rgba(0,255,225,.12),
transparent 40%
);

pointer-events:none;

z-index:-1;

}

/* LOGO */

.logo{

text-align:center;

font-size:24px;
font-weight:800;

background:linear-gradient(
90deg,
#00ffe1,
#0072ff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{

text-align:center;

font-size:9px;

margin-top:4px;

color:#bcbcbc;
}

/* CARD */

.card{

width:100%;

margin-top:16px;

padding:16px;

border-radius:24px;

background:rgba(10,15,30,.58);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(18px);

box-shadow:
0 10px 30px rgba(0,0,0,.35),
0 0 20px rgba(0,110,255,.08);
}

/* TITLE */

.title{

font-size:12px;
font-weight:700;

margin-bottom:12px;

color:#00ffe1;
}

/* TEXTAREA */

textarea{

width:100%;
height:120px;

border:none;
outline:none;
resize:none;

padding:14px;

border-radius:16px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.05);

color:white;

font-size:10px;
line-height:1.8;
}

/* BUTTON */

button{

width:100%;

height:48px;

margin-top:12px;

border:none;
outline:none;

border-radius:16px;

font-size:11px;
font-weight:700;

color:white;

background:linear-gradient(
90deg,
#00ffe1,
#0072ff
);

box-shadow:0 0 20px rgba(0,255,225,.2);

transition:.25s ease;
}

button:active{

transform:scale(.97);

}

button:disabled{

opacity:.4;
cursor:not-allowed;

}

/* BRACKET */

.bracket{

width:100%;

margin-top:18px;

display:flex;
justify-content:center;
}

.tournament{

width:100%;

display:grid;

grid-template-columns:
82px
50px
50px
50px
82px;

gap:4px;

justify-content:center;
align-items:center;
}

.round{

display:flex;
flex-direction:column;

gap:12px;
}

.match{

padding:5px;

border-radius:12px;

background:rgba(255,255,255,.04);

border:1px solid rgba(255,255,255,.06);
}

.player{

height:24px;

margin:4px 0;

padding:0 6px;

border-radius:8px;

background:rgba(255,255,255,.04);

display:flex;
align-items:center;

font-size:7px;
font-weight:700;

overflow:hidden;
white-space:nowrap;
}

.icon{

width:13px;
height:13px;

margin-right:5px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:6px;
font-weight:700;

background:linear-gradient(
90deg,
#00ffe1,
#0072ff
);

flex-shrink:0;
}

.center{

width:44px;
height:44px;

border-radius:12px;

background:rgba(255,255,255,.04);

border:1px solid rgba(255,255,255,.08);

display:flex;
align-items:center;
justify-content:center;

font-size:15px;
font-weight:700;

margin:auto;
}

.r-title{

text-align:center;

font-size:6px;
font-weight:700;

margin-bottom:4px;

color:#00ffe1;
}

.leftSemi{
margin-top:32px;
}

.final{
margin-top:72px;
}

.rightSemi{
margin-top:32px;
}

/* GRID */

.grid{

width:100%;

display:grid;

grid-template-columns:1fr 1fr;

gap:8px;

margin-top:10px;
}

/* INPUT */

.inputBox{

width:100%;

height:42px;

border:none;
outline:none;

padding:0 12px;

border-radius:14px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.05);

color:white;

font-size:10px;
font-weight:600;
}

/* WINNER */

.winner{

margin-top:16px;

padding:18px;

border-radius:22px;

text-align:center;

background:rgba(10,15,30,.58);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(18px);
}

.winner h2{

font-size:18px;
font-weight:800;
}

/* HIDDEN */

.hidden{
display:none;
}

/* ALERT */

.alertPopup{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.72);

display:none;

justify-content:center;
align-items:center;

z-index:99999;

padding:20px;
}

.alertBox{

width:100%;

max-width:300px;

padding:26px 20px;

border-radius:28px;

text-align:center;

background:rgba(10,15,30,.95);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);
}

.alertIcon{

width:70px;
height:70px;

margin:auto;

border-radius:22px;

display:flex;
align-items:center;
justify-content:center;

font-size:30px;

background:linear-gradient(
135deg,
#00ffe1,
#006eff
);
}

.alertText{

margin-top:18px;

font-size:12px;
font-weight:700;

line-height:1.8;
}

.alertBtn{

width:100%;

height:48px;

margin-top:20px;
}

/* =========================================
SPIN POPUP
========================================= */

.spinPopup{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.82);

display:none;

justify-content:center;
align-items:center;

z-index:999999;

padding:20px;
}

.spinBox{

width:100%;

padding:30px 20px;

border-radius:30px;

text-align:center;

background:rgba(10,15,30,.95);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);
}

.spinTitle{

font-size:18px;
font-weight:800;

color:#00ffe1;
}

.spinNames{

margin-top:28px;

display:flex;
align-items:center;
justify-content:center;

gap:14px;
}

.spinName{

flex:1;

height:70px;

border-radius:18px;

display:flex;
align-items:center;
justify-content:center;

font-size:14px;
font-weight:800;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

animation:pulse .4s infinite;
}

.vsText{

font-size:18px;
font-weight:800;

color:#00ffe1;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);
}

}

</style>
</head>
<body>

<div class="logo">
🏆 CEO LEAGUE
</div>

<div class="sub">
MOBILE TOURNAMENT SYSTEM
</div>

<!-- MAIN -->

<div class="card">

<div class="title">
🎮 INPUT PLAYER
</div>

<textarea id="players">
Ka Yudi
Ka Abdu
Ka Fadil
Yaser
Dean
Andika
Reza
Om Afdal
</textarea>

<button onclick="spinCup()" id="spinBtn">
⚡ SPIN CUP
</button>

<button onclick="finishSpin()" id="finishBtn">
✅ SELESAI SPIN
</button>

<div class="bracket" id="bracket"></div>

</div>

<!-- SEMI -->

<div class="card hidden" id="semiCard">

<div class="title">
🔥 INPUT SEMI FINAL
</div>

<div class="grid">

<input class="inputBox" placeholder="Semi 1">
<input class="inputBox" placeholder="Semi 2">

<input class="inputBox" placeholder="Semi 3">
<input class="inputBox" placeholder="Semi 4">

</div>

<button onclick="showFinal()" id="semiBtn">
🏆 SELESAI SEMI
</button>

</div>

<!-- FINAL -->

<div class="card hidden" id="finalCard">

<div class="title">
👑 INPUT FINAL
</div>

<div class="grid">

<input class="inputBox" placeholder="Final 1">
<input class="inputBox" placeholder="Final 2">

</div>

<button onclick="showWinner()" id="finalBtn">
🔥 SELESAI FINAL
</button>

</div>

<!-- WINNER -->

<div class="card hidden" id="winnerCard">

<div class="title">
🏆 INPUT JUARA
</div>

<input
class="inputBox"
id="winnerInput"
placeholder="Nama Juara"
style="margin-top:8px;"
>

<button onclick="finishWinner()">
👑 SELESAI JUARA
</button>

</div>

<!-- OUTPUT -->

<div class="winner hidden" id="winnerBox">

<h2 id="winnerName">
🏆 CHAMPION
</h2>

</div>

<!-- ALERT -->

<div class="alertPopup" id="alertPopup">

<div class="alertBox">

<div class="alertIcon">
🏆
</div>

<div class="alertText" id="alertText">
Alert
</div>

<button
class="alertBtn"
onclick="closeAlert()"
>
OK
</button>

</div>

</div>

<!-- SPIN POPUP -->

<div class="spinPopup" id="spinPopup">

<div class="spinBox">

<div class="spinTitle">
⚡ DRAW MATCH
</div>

<div class="spinNames">

<div class="spinName" id="spinLeft">
PLAYER
</div>

<div class="vsText">
VS
</div>

<div class="spinName" id="spinRight">
PLAYER
</div>

</div>

</div>

</div>

<script>

/* API */

const API_URL =
"https://script.google.com/macros/s/AKfycbw4fC24zyLqp4O-g5slyi0MrLfzMoo_waAbcR4qiFhbyUIb2L3KaPxf7x5V-SKKB_Sg/exec";

/* ALERT */

function showAlert(message){

document.getElementById("alertText")
.innerHTML = message;

document.getElementById("alertPopup")
.style.display = "flex";

}

function closeAlert(){

document.getElementById("alertPopup")
.style.display = "none";

}

/* SHUFFLE */

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

return array;

}

/* PLAYER HTML */

function playerHTML(name){

let first=name.charAt(0).toUpperCase();

return `

<div class="player">

<div class="icon">
${first}
</div>

${name}

</div>

`;

}

/* SPIN ANIMATION */

async function spinAnimation(finalA, finalB){

let left =
document.getElementById("spinLeft");

let right =
document.getElementById("spinRight");

let players=document
.getElementById("players")
.value
.split("\n")
.map(x=>x.trim())
.filter(x=>x!="");

/* SOUND */

const spinSound =
document.getElementById("spinSound");

const matchSound =
document.getElementById("matchSound");

return new Promise(resolve=>{

let count = 0;

/* PLAY SPIN SOUND */

spinSound.currentTime = 0;
spinSound.play();

let interval = setInterval(()=>{

let rand1 =
players[
Math.floor(Math.random()*players.length)
];

let rand2 =
players[
Math.floor(Math.random()*players.length)
];

left.innerHTML = rand1;
right.innerHTML = rand2;

count++;

if(count >= 18){

clearInterval(interval);

/* STOP SPIN SOUND */

spinSound.pause();
spinSound.currentTime = 0;

/* FINAL RESULT */

left.innerHTML = finalA;
right.innerHTML = finalB;

/* PLAY MATCH SOUND */

matchSound.currentTime = 0;
matchSound.play();

setTimeout(()=>{

resolve();

},1200);

}

},100);

});

}


/* SPIN CUP */

async function spinCup(){

let players=document
.getElementById("players")
.value
.split("\n")
.map(x=>x.trim())
.filter(x=>x!="");

if(players.length != 8){

showAlert("⚠ Player wajib 8 orang");
return;

}

players = shuffle(players);

document.getElementById("spinPopup")
.style.display = "flex";

let pairs = [];

for(let i=0;i<8;i+=2){

await spinAnimation(players[i], players[i+1]);

pairs.push([
players[i],
players[i+1]
]);

}

document.getElementById("spinPopup")
.style.display = "none";

document.getElementById("bracket").innerHTML=`

<div class="tournament">

<div class="round">

<div class="r-title">
LEFT
</div>

<div class="match">
${playerHTML(pairs[0][0])}
${playerHTML(pairs[0][1])}
</div>

<div class="match">
${playerHTML(pairs[1][0])}
${playerHTML(pairs[1][1])}
</div>

</div>

<div class="round leftSemi">

<div class="r-title">
SEMI
</div>

<div class="center">
🔥
</div>

</div>

<div class="round final">

<div class="r-title">
FINAL
</div>

<div class="center">
🏆
</div>

</div>

<div class="round rightSemi">

<div class="r-title">
SEMI
</div>

<div class="center">
🔥
</div>

</div>

<div class="round">

<div class="r-title">
RIGHT
</div>

<div class="match">
${playerHTML(pairs[2][0])}
${playerHTML(pairs[2][1])}
</div>

<div class="match">
${playerHTML(pairs[3][0])}
${playerHTML(pairs[3][1])}
</div>

</div>

</div>

`;

showAlert("🔥 Draw match berhasil dibuat");

}

/* FINISH SPIN */

function finishSpin(){

document.getElementById("spinBtn").disabled=true;
document.getElementById("finishBtn").disabled=true;
document.getElementById("players").disabled=true;

document.getElementById("semiCard")
.classList.remove("hidden");

}

/* SHOW FINAL */

function showFinal(){

let semiInputs =
document.querySelectorAll("#semiCard input");

let empty = false;

semiInputs.forEach(x=>{

if(x.value.trim()==""){
empty = true;
}

});

if(empty){

showAlert("⚠ Isi semua nama Semi Final");
return;

}

semiInputs.forEach(x=>x.disabled=true);

document.getElementById("semiBtn")
.disabled=true;

document.getElementById("finalCard")
.classList.remove("hidden");

showAlert("🔥 Semi Final berhasil disimpan");

}

/* SHOW WINNER */

function showWinner(){

let finalInputs =
document.querySelectorAll("#finalCard input");

let empty = false;

finalInputs.forEach(x=>{

if(x.value.trim()==""){
empty = true;
}

});

if(empty){

showAlert("⚠ Isi semua nama Final");
return;

}

finalInputs.forEach(x=>x.disabled=true);

document.getElementById("finalBtn")
.disabled=true;

document.getElementById("winnerCard")
.classList.remove("hidden");

showAlert("🏆 Final berhasil disimpan");

}

/* FINISH WINNER */

async function finishWinner(){

let winner=document
.getElementById("winnerInput")
.value;

if(winner==""){

showAlert("⚠ Masukkan nama juara");
return;

}

document.getElementById("winnerInput")
.disabled=true;

document.getElementById("winnerBox")
.classList.remove("hidden");

document.getElementById("winnerName")
.innerHTML=`👑 ${winner}`;

try{

let res = await fetch(API_URL);

let oldData = await res.json();

let nextWeek =
"CEO WEEK " + (oldData.length + 1);

await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

week: nextWeek,
winner: winner

})

});

showAlert("👑 Juara berhasil disimpan");

setTimeout(()=>{

window.location.href = "index.html";

},1500);

}catch(err){

showAlert("⚠ Gagal menyimpan data");

}

}

</script>
<!-- =========================================
SOUND EFFECT
========================================= -->

<audio id="spinSound" preload="auto">
<source src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" type="audio/mpeg">
</audio>

<audio id="matchSound" preload="auto">
<source src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3" type="audio/mpeg">
</audio>
</body>
</html>
